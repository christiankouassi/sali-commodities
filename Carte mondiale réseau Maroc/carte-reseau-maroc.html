<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte réseau — Maroc Hub Salé</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;background:#eef0f2;font-family:'Segoe UI',Arial,sans-serif;}
  #wrap{
    max-width:1760px;margin:24px auto;background:#fff;border-radius:28px;
    box-shadow:0 10px 40px rgba(20,30,50,.08);padding:36px;position:relative;overflow:hidden;
  }
  #stage{position:relative;width:100%;aspect-ratio:1750/900;}
  svg{position:absolute;inset:0;width:100%;height:100%;}
  .land{fill:#E8ECF2;}
  .route{fill:none;stroke:#1D9878;stroke-width:2.4;stroke-dasharray:2 6;stroke-linecap:round;stroke-dashoffset:0;animation:flow 1.4s linear infinite;}
  .dot-outer{fill:#fff;stroke:#1D9878;stroke-width:2.5;}
  .dot-inner{fill:#1D9878;}
  .pulse{fill:none;stroke:#1D9878;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;}
  .hub-dot{fill:#1C2C46;}
  .hub-ring{fill:none;stroke:#1C2C46;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;}
  @keyframes flow{to{stroke-dashoffset:-16;}}
  @keyframes pulse{0%{opacity:.55;transform:scale(1);}100%{opacity:0;transform:scale(2.8);}}
  .label{
    position:absolute;
    background:#fff;color:#253D62;font-weight:700;font-size:clamp(11px,1.05vw,15px);
    padding:.5em 1em;border-radius:999px;white-space:nowrap;
    box-shadow:0 3px 10px rgba(20,30,50,.12);pointer-events:none;
  }
  .label.hub{background:#1C2C46;color:#fff;letter-spacing:.03em;font-size:clamp(12px,1.15vw,16px);}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><svg id="map"></svg><div id="labels"></div></div></div>
<script>
const W = 1750, H = 900;
const svg = d3.select('#map').attr('viewBox', `0 0 ${W} ${H}`);
const projection = d3.geoNaturalEarth1().translate([W/2, H/2*1.02]).scale(W/6.35);
const path = d3.geoPath(projection);

const HUB = [-6.8, 33.98];
const NODES = [
  { name: "États-Unis", coord: [-100, 39], side: "left" },
  { name: "Europe", coord: [8, 49], side: "top" },
  { name: "Égypte", coord: [30.8, 26.8], side: "bottom" },
  { name: "Moyen-Orient & Asie", coord: [58, 26], side: "right" },
  { name: "Afrique de l'Ouest", coord: [-9.5, 11.5], side: "left" },
  { name: "Afrique du Sud", coord: [26.5, -28.5], side: "bottom" },
];

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topology => {
  const countries = topojson.feature(topology, topology.objects.countries);
  svg.append('g').selectAll('path').data(countries.features).join('path')
    .attr('class', 'land').attr('d', path);

  const hubXY = projection(HUB);
  svg.append('circle').attr('class','hub-ring').attr('cx',hubXY[0]).attr('cy',hubXY[1]).attr('r',7);
  svg.append('circle').attr('class','hub-dot').attr('cx',hubXY[0]).attr('cy',hubXY[1]).attr('r',7);

  const routes = svg.append('g');
  const dots = svg.append('g');
  const labelsDiv = d3.select('#labels');

  NODES.forEach((n, i) => {
    const p = projection(n.coord);
    const mx = (hubXY[0] + p[0]) / 2;
    const my = (hubXY[1] + p[1]) / 2 - Math.abs(p[0]-hubXY[0]) * 0.28 - 20;
    routes.append('path').attr('class','route')
      .attr('d', `M${hubXY[0]},${hubXY[1]} Q${mx},${my} ${p[0]},${p[1]}`);
    dots.append('circle').attr('class','pulse').attr('cx',p[0]).attr('cy',p[1]).attr('r',7).style('animation-delay', `${i*0.3}s`);
    dots.append('circle').attr('class','dot-outer').attr('cx',p[0]).attr('cy',p[1]).attr('r',7);
    dots.append('circle').attr('class','dot-inner').attr('cx',p[0]).attr('cy',p[1]).attr('r',3.2);

    const anchors = {
      left:   { off:[-16,0],  transform:'translate(-100%,-50%)' },
      right:  { off:[16,0],   transform:'translate(0,-50%)' },
      top:    { off:[0,-16],  transform:'translate(-50%,-100%)' },
      bottom: { off:[0,16],   transform:'translate(-50%,0)' },
      bottomleft: { off:[-10,20], transform:'translate(-100%,0)' },
    }[n.side];
    labelsDiv.append('div').attr('class','label')
      .style('left', `${(p[0]+anchors.off[0])/W*100}%`)
      .style('top', `${(p[1]+anchors.off[1])/H*100}%`)
      .style('transform', anchors.transform)
      .text(n.name);
  });

  labelsDiv.append('div').attr('class','label hub')
    .style('left', `${hubXY[0]/W*100}%`)
    .style('top', `${(hubXY[1]+34)/H*100}%`)
    .style('transform', 'translate(-50%,-50%)')
    .text('MAROC HUB SALÉ');
});
</script>
</body>
</html>
