  <script>
    function copySignature() {
      const container = document.getElementById('signature-container');
      const html = container.innerHTML;
      
      if (navigator.clipboard && window.ClipboardItem) {
        const blob = new Blob([html], { type: 'text/html' });
        const plainBlob = new Blob([container.innerText], { type: 'text/plain' });
        const item = new ClipboardItem({
          'text/html': blob,
          'text/plain': plainBlob
        });
        navigator.clipboard.write([item]).then(() => {
          showFeedback();
        }).catch(() => {
          fallbackCopy(container);
        });
      } else {
        fallbackCopy(container);
      }
    }

    function fallbackCopy(container) {
      const range = document.createRange();
      range.selectNode(container);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      try {
        document.execCommand('copy');
        selection.removeAllRanges();
        showFeedback();
      } catch (err) {
        alert('Impossible de copier automatiquement. Sélectionnez la signature manuellement et copiez-la.');
      }
    }

    function showFeedback() {
      const feedback = document.getElementById('copy-feedback');
      feedback.classList.add('show');
      setTimeout(() => feedback.classList.remove('show'), 2500);
    }
  </script>
